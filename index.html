<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Firebase Auth Test</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 2rem; }
    button { padding: 1rem 2rem; font-size: 1.2rem; }
    #status { margin-top: 1rem; font-weight: bold; }
    #error { color: red; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Firebase Authentication Test</h1>

  <button id="login-button">Login Anonymously</button>
  
  <div id="status">Not logged in</div>
  <div id="error"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    // 🔧 Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCF8rg7QuK6oNBwDgqgxWEes8A_4WvllVU",
      authDomain: "lsv-aperolstand.firebaseapp.com",
      projectId: "lsv-aperolstand",
      storageBucket: "lsv-aperolstand.firebasestorage.app",
      messagingSenderId: "62289008940",
      appId: "1:62289008940:web:db4822f38b0b6fcfe7f489",
      measurementId: "G-N4L6V2XGF0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginButton = document.getElementById('login-button');
    const statusDiv = document.getElementById('status');
    const errorDiv = document.getElementById('error');

    loginButton.addEventListener('click', () => {
      statusDiv.textContent = 'Attempting to log in...';
      errorDiv.textContent = ''; // Clear previous errors

      console.log('Login button clicked. Attempting to sign in anonymously...');

      signInAnonymously(auth)
        .then((userCredential) => {
          const user = userCredential.user;
          console.log('Successfully signed in anonymously:', user);
          statusDiv.textContent = `Success! Logged in with UID: ${user.uid}`;
          loginButton.style.display = 'none'; // Hide button after success
        })
        .catch((error) => {
          console.error('Firebase Authentication Error:', error);
          statusDiv.textContent = 'Login Failed';
          errorDiv.textContent = `Error (${error.code}): ${error.message}`;
        });
    });
  </script>
</body>
</html>
