<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Data</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; max-width: 900px; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: center; }
    th { background: #f0f0f0; }
    input[type="number"] { width: 4rem; }
    input[type="datetime-local"] { font-size: 0.9rem; }
    button { padding: 0.4rem 0.8rem; margin: 0 0.2rem; cursor: pointer; }
    .save-btn { background: #2e7d32; color: white; border: none; border-radius: 4px; }
    .delete-btn { background: #c62828; color: white; border: none; border-radius: 4px; }
    .totals { font-weight: bold; margin-top: 1rem; }
    .status { font-size: 0.85rem; color: #2e7d32; min-height: 1rem; }
    .prices-table { max-width: 500px; margin-bottom: 1.5rem; }
    .prices-table input[type="number"] { width: 5rem; }
  </style>
</head>
<body>
  <h1>Order Data</h1>
  <p>This log is permanent: deleting an order on the Locked Rows page does not remove it from here.</p>

  <h2>Drink Prices</h2>
  <table class="prices-table">
    <thead>
      <tr id="priceHeaderRow"></tr>
    </thead>
    <tbody>
      <tr id="priceRow"></tr>
    </tbody>
  </table>
  <button id="savePricesBtn" class="save-btn">Save Prices</button>
  <div class="status" id="priceStatus"></div>

  <h2>Orders</h2>
  <p>Edit any field and click Save to update that order.</p>
  <table>
    <thead>
      <tr id="headerRow">
        <th>Order #</th>
        <th>Aperol</th>
        <th>Lillet</th>
        <th>Hugo</th>
        <th>Cuba</th>
        <th>Sekt</th>
        <th>Time</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="totals" id="totals"></div>
  <p><a href="index.html">⬅ Back to Home</a></p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    // 🔧 Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCF8rg7QuK6oNBwDgqgxWEes8A_4WvllVU",
      authDomain: "lsv-aperolstand.firebaseapp.com",
      projectId: "lsv-aperolstand",
      storageBucket: "lsv-aperolstand.firebasestorage.app",
      messagingSenderId: "62289008940",
      appId: "1:62289008940:web:db4822f38b0b6fcfe7f489",
      measurementId: "G-N4L6V2XGF0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const names = ["Aperol", "Lillet", "Hugo", "Cuba", "Sekt"];
    const tbody = document.getElementById("rows");
    const totalsDiv = document.getElementById("totals");
    const LOG_COLLECTION = "orderLog"; // permanent log, independent of page2's "lockedRows" queue

    // ---- Prices ----
    const priceHeaderRow = document.getElementById("priceHeaderRow");
    const priceRow = document.getElementById("priceRow");
    const priceStatus = document.getElementById("priceStatus");
    let currentPrices = [0, 0, 0, 0, 0];
    const priceInputs = names.map((name, i) => {
      const th = document.createElement("th");
      th.textContent = name;
      priceHeaderRow.appendChild(th);

      const input = document.createElement("input");
      input.type = "number";
      input.min = "0";
      input.step = "0.01";
      input.value = 0;
      const td = document.createElement("td");
      td.appendChild(input);
      priceRow.appendChild(td);
      return input;
    });

    document.getElementById("savePricesBtn").addEventListener("click", async () => {
      const newPrices = priceInputs.map(inp => parseFloat(inp.value) || 0);
      await setDoc(doc(db, "state", "prices"), { values: newPrices });
      priceStatus.textContent = "Saved ✓";
      setTimeout(() => { priceStatus.textContent = ""; }, 1500);
    });

    onSnapshot(doc(db, "state", "prices"), snap => {
      currentPrices = snap.exists() ? snap.data().values : [0, 0, 0, 0, 0];
      priceInputs.forEach((inp, i) => { inp.value = currentPrices[i] ?? 0; });
      renderTotals();
    });

    // ---- Orders ----
    let latestOrders = [];

    function toLocalInputValue(ts) {
      const d = new Date(ts);
      const pad = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function renderRow(id, data) {
      const tr = document.createElement("tr");

      const orderInput = document.createElement("input");
      orderInput.type = "number";
      orderInput.value = data.orderNumber ?? "";
      const orderTd = document.createElement("td");
      orderTd.appendChild(orderInput);
      tr.appendChild(orderTd);

      const valueInputs = [];
      names.forEach((_, i) => {
        const input = document.createElement("input");
        input.type = "number";
        input.min = "0";
        input.value = data.values?.[i] ?? 0;
        valueInputs.push(input);
        const td = document.createElement("td");
        td.appendChild(input);
        tr.appendChild(td);
      });

      const tsInput = document.createElement("input");
      tsInput.type = "datetime-local";
      tsInput.value = toLocalInputValue(data.ts ?? Date.now());
      const tsTd = document.createElement("td");
      tsTd.appendChild(tsInput);
      tr.appendChild(tsTd);

      const actionsTd = document.createElement("td");

      const status = document.createElement("div");
      status.className = "status";

      const saveBtn = document.createElement("button");
      saveBtn.textContent = "Save";
      saveBtn.className = "save-btn";
      saveBtn.addEventListener("click", async () => {
        const newValues = valueInputs.map(inp => parseInt(inp.value, 10) || 0);
        const newTs = new Date(tsInput.value).getTime();
        await updateDoc(doc(db, LOG_COLLECTION, id), {
          orderNumber: parseInt(orderInput.value, 10) || 0,
          values: newValues,
          ts: newTs
        });
        status.textContent = "Saved ✓";
        setTimeout(() => { status.textContent = ""; }, 1500);
      });

      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "Delete";
      deleteBtn.className = "delete-btn";
      deleteBtn.addEventListener("click", async () => {
        if (confirm("Permanently delete this order from the log?")) {
          await deleteDoc(doc(db, LOG_COLLECTION, id));
        }
      });

      actionsTd.appendChild(saveBtn);
      actionsTd.appendChild(deleteBtn);
      actionsTd.appendChild(status);
      tr.appendChild(actionsTd);

      return tr;
    }

    function renderTotals() {
      const totals = [0, 0, 0, 0, 0];
      latestOrders.forEach(data => {
        (data.values || []).forEach((v, i) => { totals[i] += v; });
      });
      const totalDrinks = totals.reduce((sum, v) => sum + v, 0);
      const revenue = totals.reduce((sum, v, i) => sum + v * (currentPrices[i] || 0), 0);
      totalsDiv.innerHTML =
        "Totals: " + names.map((n, i) => `${n}: ${totals[i]}`).join(" | ") +
        `<br>Total drinks sold: ${totalDrinks}` +
        `<br>Total revenue: €${revenue.toFixed(2)}`;
    }

    const q = query(collection(db, LOG_COLLECTION), orderBy("ts"));
    onSnapshot(q, snapshot => {
      tbody.innerHTML = "";
      latestOrders = snapshot.docs.map(docSnap => docSnap.data());
      if (snapshot.empty) {
        tbody.innerHTML = "<tr><td colspan='8'>No orders yet.</td></tr>";
        totalsDiv.textContent = "";
        return;
      }
      snapshot.forEach(docSnap => {
        tbody.appendChild(renderRow(docSnap.id, docSnap.data()));
      });
      renderTotals();
    });
  </script>
</body>
</html>
