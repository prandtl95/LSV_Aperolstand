<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Counter Page</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 2rem; }
    button { margin: 0.5rem; padding: 1rem 2rem; font-size: 1.2rem; border: none; border-radius: 6px; color: white; cursor: pointer; }
    .row { display: flex; gap: 1rem; margin-bottom: 1rem; }
    .aperol { background-color: orange; }
    .lillet { background-color: gold; color: black; }   /* yellow works better with dark text */
    .Sarti { background-color: green; }
    .cuba { background-color: saddlebrown; }
    .sekt { background-color: #722f37; } /* wine-like color */
    .intern { background-color: steelblue; }
    .limoncello { background-color: #ffeb3b; color: black; }
    .control-btn { background: #444; }
    .danger-btn { background: #b71c1c; }
  </style>
</head>
<body>
  <h1>Counter Page</h1>
  <div class="row">
    <button id="btn0" class="aperol">Aperol: 0</button>
    <button id="btn1" class="lillet">Lillet: 0</button>
    <button id="btn2" class="Sarti">Sarti: 0</button>
    <button id="btn3" class="cuba">Cuba: 0</button>
    <button id="btn4" class="sekt">Sekt: 0</button>
    <button id="btn5" class="intern">Intern: 0</button>
    <button id="btn6" class="limoncello">Limoncello: 0</button>
  </div>
  <div class="row">
    <button id="reset" class="control-btn">Reset</button>
    <button id="lock" class="control-btn">Lock</button>
  </div>
  <h2>Logged Orders</h2>
  <div class="row">
    <button id="deleteLoggedRows" class="danger-btn">Delete Logged Rows</button>
  </div>
  <div id="locked-rows-container"></div>
  <a href="index.html">⬅ Back to Home</a>

  <!-- Firebase App (modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, addDoc, runTransaction, query, orderBy, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    // 🔧 Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCF8rg7QuK6oNBwDgqgxWEes8A_4WvllVU",
      authDomain: "lsv-aperolstand.firebaseapp.com",
      projectId: "lsv-aperolstand",
      storageBucket: "lsv-aperolstand.firebasestorage.app",
      messagingSenderId: "62289008940",
      appId: "1:62289008940:web:db4822f38b0b6fcfe7f489",
      measurementId: "G-N4L6V2XGF0"
    };

    // ✅ Init Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Drinks + counters
    const names = ["Aperol", "Lillet", "Sarti", "Cuba", "Sekt", "Intern", "Limoncello"];
    let counters = [0, 0, 0, 0, 0, 0, 0];

    function updateButtons() {
      counters.forEach((val, i) => {
        document.getElementById(`btn${i}`).innerText = `${names[i]}: ${val}`;
      });
    }

    async function loadCounters() {
      const ref = doc(db, "state", "counters");
      const snap = await getDoc(ref);
      if (snap.exists()) {
        const saved = snap.data().values;
        // Pad in case drinks were added after this data was saved
        counters = names.map((_, i) => saved[i] ?? 0);
      }
      updateButtons();
    }

    async function saveCounters() {
      const ref = doc(db, "state", "counters");
      await setDoc(ref, { values: counters });
    }

    async function loadLockedRows() {
      const container = document.getElementById("locked-rows-container");
      container.innerHTML = ""; // Clear previous content
      const ref = collection(db, "lockedRows");
      const q = query(ref, orderBy("ts", "desc"));
      const snapshot = await getDocs(q);
      snapshot.forEach(doc => {
        const data = doc.data();
        const row = document.createElement("div");
        row.classList.add("row");
        const values = data.values.join(", ");
        const date = new Date(data.ts).toLocaleString();
        row.innerText = `[${date}] ${names.map((name, i) => `${name}: ${data.values[i]}`).join(', ')}`;
        container.appendChild(row);
      });
    }

    // Button listeners
    counters.forEach((_, i) => {
      document.getElementById(`btn${i}`).addEventListener("click", async () => {
        counters[i]++;
        updateButtons();
        await saveCounters();
      });
    });

    document.getElementById("reset").addEventListener("click", async () => {
      counters = [0, 0, 0, 0, 0, 0, 0];
      updateButtons();
      await saveCounters();
    });

    document.getElementById("lock").addEventListener("click", async () => {
      // Atomically get the next order number so concurrent locks never collide
      const counterRef = doc(db, "state", "orderCounter");
      const orderNumber = await runTransaction(db, async (tx) => {
        const snap = await tx.get(counterRef);
        const next = (snap.exists() ? snap.data().value : 0) + 1;
        tx.set(counterRef, { value: next });
        return next;
      });

      const orderData = { orderNumber, values: [...counters], ts: Date.now() };
      // "lockedRows" is the working queue shown/cleared on page2.
      // "orderLog" is a permanent record kept for page3, unaffected by page2 deletions.
      await Promise.all([
        addDoc(collection(db, "lockedRows"), orderData),
        addDoc(collection(db, "orderLog"), orderData)
      ]);
      counters = [0, 0, 0, 0, 0, 0, 0]; // reset after lock
      updateButtons();
      await saveCounters();
      await loadLockedRows();
    });

    document.getElementById("deleteLoggedRows").addEventListener("click", async () => {
      if (!confirm("Delete all logged rows? This cannot be undone.")) return;
      const snapshot = await getDocs(collection(db, "lockedRows"));
      await Promise.all(snapshot.docs.map(d => deleteDoc(doc(db, "lockedRows", d.id))));
      await loadLockedRows();
    });

    // Load counters on page load
    loadCounters();
    loadLockedRows();
  </script>
</body>
</html>
